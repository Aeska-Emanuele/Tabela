<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desafio 02</title>

   <style>
        body{
            font-family: Arial, Helvetica, sans-serif;
        }

        table{
            width: 400px;
            height: 100px;
            border-collapse: separate;
            border-spacing: 1px;
        }

        td {
            border: 1px black;
            padding: 8px;
            border: 2px solid black;
            text-align: center; /*---Alinhamento Horizontal*/
            vertical-align: middle; /*---Alinhamento Vertical*/
        }

        .numero{
            text-align: right; /*---Para colocar numeros a direita, cmo no excel*/ /*colocar a classe normal no td*/
        }
        </style>

</head>
<body>
    <h1>PLANILHA 02</h1>

    <table>
    <tr>
        <td colspan="4">A</td>
        <td rowspan="4">B</td>
    </tr>

    <tr>
        <td rowspan="4">C</td>
        <td>D</td>
        <td>E</td> 
        <td>F</td>
    </tr>

    <tr>
        <td>G</td>
        <td>H</td>
        <td>I</td>
    </tr>

    <tr>
        <td>J</td>
        <td>L</td>
        <td>M</td>
    </tr>

    <tr>
        <td colspan="4">N</td>
    </tr>
</table>

</body>
</html>
