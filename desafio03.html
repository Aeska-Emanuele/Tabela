<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabela 03 </title>
</head>
<body>
     <style>
        body{
            font-family: Arial, Helvetica, sans-serif;
        }

        table{
            width: 400px;
            height: 100px;
            border-collapse: separate;
            border-spacing: 0.5px;
        }

        td {
            border: 0.5px black;
            padding: 5px;
            border: 0.5px solid black;
            text-align: center; /*---Alinhamento Horizontal*/
            vertical-align: middle; /*---Alinhamento Vertical*/
        }

    .titulo {
           font-weight: bold; /* Deixa em negrito*/
        }
        </style>

</head>
<body>
    <h1>PLANILHA 03</h1>

    <table>

    <tr class="titulo">
        <td>GRUPO</td>
        <td>NOMES</td>
        <td colspan="3">FILMES</td>
    </tr>

    <tr>
        <td rowspan="3" class="titulo">MULHERES</td>
        <td>ANA</td>
        <td>ALIEN</td>
        <td>RAMBO</td>
        <td>VINGADORES</td>
    </tr>

    <tr>
        <td>BEATRIZ</td>
        <td>HUCK</td>
        <td>INCEPTION</td>
        <td>BATMAN</td>
    
    </tr>
 
    <tr>
        <td>CLAUDIA</td>
        <td>OBLIVION</td>
        <td>MATRIX</td>
        <td>BIG HERO</td>
    </tr>

    <tr>
        <td rowspan="3" class="titulo">HOMENS</td>
        <td>BRUNO</td>
        <td>INTOCAVEIS</td>
        <td>AMNÉSIA</td>
        <td>GLADIADOR</td>
    
    </tr>

    <tr>
        <td>DANILO</td>
        <td>WALL-LE</td>
        <td>OLD BOY</td>
        <td>DANGAL</td>
    </tr>
    
<tr>
        <td>FABIANO</td>
        <td>STAR WARS</td>
        <td>TAXI DRIVER</td>
        <td>TOY STORY</td>
</tr>
  

</table>
</body>
</html>
