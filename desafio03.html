<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabela 03 </title>
</head>

     <style>
        body{
            font-family: Arial, Helvetica, sans-serif;
        }

        table{
            width: 400px;
            height: 100px;
            border-collapse: collapse;
            border-spacing: 0.5px;
        }

       th, td {
            border: 1px black;
            padding: 10px;
            border: 0.5px solid black;
            text-align: center; /*---Alinhamento Horizontal*/
            vertical-align: middle; /*---Alinhamento Vertical*/
        }

caption{
    font-size: 1.3em;
    font-weight: bold;
    padding: 10px;
}

    .titulo {
           font-weight: bold; /*Deixa em negrito*/ 
           /*---scope só cabe em th e a diferença entre col e colgroup é que um col para uma coluna e colgroup é para mais de uma*/
        }
        </style>


</head>

<body>

    <h1>PLANILHA 03</h1>

<table>

<caption>
    Filmes favoritos
</caption>

<head>  
    <tr class="titulo">
        <th scope="col">GRUPOS</th>
        <th scope="col">NOMES</th>
        <th colspan="3" scope="colgroup">FILMES</th> 
    </tr>
</head>

<body>
    
    <tr>
        <th rowspan="3" class="titulo" scope="rowgroup">MULHERES</th>
        <td>ANA</td>
        <td>ALIEN</td>
        <td>RAMBO</td>
        <td>VINGADORES</td>
    </tr>

    <tr>
        <td>BEATRIZ</td>
        <td>HULK</td>
        <td>INCEPTION</td>
        <td>BATMAN</td>
    
    </tr>
 
    <tr>
        <td>CLAUDIA</td>
        <td>OBLIVION</td>
        <td>MATRIX</td>
        <td>BIG HERO</td>
    </tr>

    <tr>
        <th rowspan="3" class="titulo" scope="rowgroup">HOMENS</th>
        <td>BRUNO</td>
        <td>INTOCAVEIS</td>
        <td>AMNÉSIA</td>
        <td>GLADIADOR</td>
    
    </tr>

    <tr>
        <td>DANILO</td>
        <td>WALL-LE</td>
        <td>OLD BOY</td>
        <td>DANGAL</td>
    </tr>
    
<tr>
        <td>FABIANO</td>
        <td>STAR WARS</td>
        <td>TAXI DRIVER</td>
        <td>TOY STORY</td>
</tr>
</body>
  
<tfoot>
<th colspan="4" scope="col">TOTAL</th>
<td>10000</td>
</tfoot>

</table>




</body>
</html>
